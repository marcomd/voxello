name: CI

# Runs on pushes to main, pull requests and by hand. `workflow_call` lets release.yml run the
# same matrix on the tagged commit before anything is built or published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          # Portability leg: the suite runs with fakes, no audio. The coverage floor is not
          # enforced here because POSIX-only branches are skipped on Windows.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-groups --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Type-check
        run: uv run pyright src
      - name: Unit tests with branch coverage
        if: runner.os != 'Windows'
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Unit tests (Windows, no coverage floor)
        if: runner.os == 'Windows'
        run: uv run pytest
      - name: Upload coverage reports
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: warn
      - name: Build
        run: uv build
