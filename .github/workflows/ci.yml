name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --python 3.12
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Type-check
        run: uv run pyright src
      - name: Unit tests
        run: uv run pytest
      - name: Build
        run: uv build
