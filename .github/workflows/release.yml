# Release: push a tag `vX.Y.Z` that matches `__version__` in src/voxello/__init__.py.
# The workflow first runs the CI matrix (ruff, pyright, pytest with the coverage floor) on the
# tagged commit, then builds the sdist and wheel, attaches them to a GitHub release and
# publishes to PyPI through trusted publishing (no API token stored in the repo). A tag on a
# commit that fails the checks publishes nothing. One-time setup on pypi.org: project
# `voxello` -> Publishing -> add a GitHub publisher with owner `marcomd`, repository `voxello`,
# workflow `release.yml`, environment `pypi`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time per tag; never cancel a publish that is already running.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check that the tag matches the package version
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' src/voxello/__init__.py)"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match __version__ = '$version' in src/voxello/__init__.py"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          uv build
          ls dist/voxello-"${GITHUB_REF_NAME#v}"-py3-none-any.whl dist/voxello-"${GITHUB_REF_NAME#v}".tar.gz
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Smoke test the wheel
        run: |
          set -euo pipefail
          uv run --isolated --no-project --with dist/*.whl voxello --version
          uv run --isolated --no-project --with dist/*.whl voxello install claude --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
