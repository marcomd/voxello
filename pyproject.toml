[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxello"
dynamic = ["version"]
description = "A local voice and notification layer for AI agents (MCP server bridging VoiceStudio TTS to local playback)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Marco Mastrodonato" }]
keywords = ["mcp", "tts", "voice", "notifications", "agents", "voicestudio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "mcp>=2.2,<3",
  "httpx2>=2.5",
  "pydantic>=2.12",
  "pydantic-settings[yaml]>=2.15",
  "platformdirs>=4",
]

[project.scripts]
voxello = "voxello.cli:main"

[project.urls]
Homepage = "https://github.com/marcomd/voxello"
Repository = "https://github.com/marcomd/voxello"
Issues = "https://github.com/marcomd/voxello/issues"
Changelog = "https://github.com/marcomd/voxello/releases"

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
  "pyright>=1.1",
  "pytest-cov>=6",
]

[tool.hatch.version]
path = "src/voxello/__init__.py"

[tool.hatch.build]
exclude = ["/docs/engineering-review.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/voxello"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "README.md",
  "LICENSE",
  "CLAUDE.md",
  "AGENTS.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "config.example.yaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a running VoiceStudio or real audio hardware"]
addopts = "-m 'not integration' --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["voxello"]
relative_files = true

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "E501"]
"src/voxello/notifications/desktop.py" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
